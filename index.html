<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#30291f">
  <title>追思 · 懷念</title>
  <link rel="stylesheet" href="style.css?v=portrait-20260910">
  <script defer src="photos.js?v=20260909"></script>
  <script defer src="music.js"></script>
  <script defer src="app.js?v=silent-1"></script>
</head>
<body>
  <main id="home" class="home">
    <img id="sacred-background" class="sacred-background" src="img/west3saints.jpg" alt="">
    <div class="veil"></div>
    <section class="memorial" aria-labelledby="title">
      <div class="portrait-frame"><img id="portrait" src="img/firstpic.jpg" alt="長輩的紀念照片"><p id="portrait-fallback" hidden>音容宛在</p></div>
      <h1 id="title">追思</h1>
      <div class="start-actions">
        <button id="start" type="button">開始 <span aria-hidden="true">▷</span></button>
        <button id="start-silent" type="button">開始-無聲版</button>
      </div>
      <p class="hint">讓思念，隨光影緩緩流轉</p>
      <p id="home-status" class="status" role="status"></p>
    </section>
  </main>
  <section id="player" class="player" aria-label="追思相片播放" tabindex="-1" hidden>
    <img class="slide" alt="">
    <img class="slide" alt="">
    <div id="controls" class="controls" hidden><button id="stop" type="button">結束</button></div>
    <p id="play-status" class="play-status" role="status"></p>
    <button id="audio-retry" class="audio-retry" type="button" hidden>點此開啟音樂</button>
  </section>
  <audio id="audio" preload="auto" playsinline></audio>
  <noscript>請開啟瀏覽器的 JavaScript，才能播放追思相片。</noscript>
</body>
</html>
